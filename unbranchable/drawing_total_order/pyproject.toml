[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderable"
version = "0.1.0"
description = "For working with continents and compute total orders from them"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["orderable"]

[tool.setuptools.package-dir]
orderable = "src"
