[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unbranchable"
version = "0.1.0"
description = "Tools for experiments with taut triangulations and branchings"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["unbranchable"]

[tool.setuptools.package-dir]
unbranchable = "src"
